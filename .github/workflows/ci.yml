name: Newsroom CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check newsroom tests
      - name: Mypy baseline (informational)
        run: mypy newsroom > mypy-baseline.txt || true
      - name: Upload mypy baseline
        uses: actions/upload-artifact@v4
        with:
          name: mypy-baseline
          path: mypy-baseline.txt
      - name: Backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend lint
        run: npm run lint
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend production build
        run: npm run build
      - name: AST-04 browser status smoke
        run: python3 ../scripts/astra04_browser_smoke.py --frontend-dist dist --output ../.artifacts/astra04-browser-status
      - name: Upload AST-04 browser status evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra04-browser-status
          path: .artifacts/astra04-browser-status
