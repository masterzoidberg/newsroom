name: Newsroom CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check newsroom tests
      - name: Mypy baseline (informational)
        run: mypy newsroom > mypy-baseline.txt || true
      - name: Upload mypy baseline
        uses: actions/upload-artifact@v4
        with:
          name: mypy-baseline
          path: mypy-baseline.txt
      - name: Backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install browser qualification dependency
        run: python -m pip install "selenium>=4.25,<5"
      - name: Frontend lint
        run: npm run lint
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend production build
        run: npm run build
      - name: AST-04 browser status smoke
        run: python ../scripts/astra04_browser_smoke.py --frontend-dist dist --output ../.artifacts/astra04-browser-status
      - name: Upload AST-04 browser status evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra04-browser-status
          path: .artifacts/astra04-browser-status
      - name: AST-24 onboarding browser qualification
        run: >-
          python ../scripts/astra24_browser_smoke.py
          --frontend-dist dist
          --output ../.artifacts/astra24-browser-onboarding
          --source-commit "${{ github.sha }}"
      - name: Upload AST-24 onboarding browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra24-browser-onboarding
          path: .artifacts/astra24-browser-onboarding

  windows-start-newsroom:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Windows smoke dependencies
        shell: powershell
        run: >-
          python -m pip install
          "argon2-cffi>=23.1"
          "fastapi>=0.100"
          "openai>=1.68,<2.0"
          "pydantic>=2.0"
          "uvicorn>=0.23"
          "pytest>=8.0"
          "httpx>=0.24"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build accepted frontend artifact
        working-directory: frontend
        run: npm run build
      - name: Verify release source remains clean
        shell: powershell
        run: |
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) {
            throw "Windows qualification source is dirty: $($dirty -join '; ')"
          }
      - name: AST-05 installed Windows lifecycle smoke
        shell: powershell
        run: >-
          .\scripts\astra05_windows_smoke.ps1
          -SourceRoot "${{ github.workspace }}"
          -OutputDirectory "${{ github.workspace }}\.artifacts\astra05-windows"
          -PythonExe python
      - name: Upload AST-05 Windows qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra05-windows-qualification
          path: .artifacts/astra05-windows
