[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom"
version = "0.1.0.dev0"
description = "Standalone, evidence-first personal news intelligence system"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.100",
    "openai>=1.68,<2.0",
    "pydantic>=2.0",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
packages = ["newsroom", "newsroom.evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
warn_unused_ignores = false
# Existing repository baseline is not yet tractable; CI records it without
# making unrelated legacy annotations a Phase 28.5 gate.
