[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom"
version = "0.1.0.dev0"
description = "Standalone, evidence-first personal news intelligence system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.24"]

[tool.setuptools]
packages = ["newsroom", "newsroom.evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
