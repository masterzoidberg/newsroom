[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom"
version = "0.1.0.dev0"
description = "Standalone, evidence-first personal news intelligence system"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["newsroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
